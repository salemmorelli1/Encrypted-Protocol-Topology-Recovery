name: Validate statistical engine

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy pandas scikit-learn statsmodels networkx scapy matplotlib reportlab pypdf pytest ruff
          python -m pip install -e . --no-deps
      - name: Lint and test
        run: |
          python -m ruff check .
          python -m pytest -q
      - name: Build and verify exact-page report
        run: |
          python scripts/build_report.py
          python scripts/verify_artifacts.py
