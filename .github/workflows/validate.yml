name: Validate statistical engine

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r requirements-ci-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Verify environment, types, syntax, and behavior
        run: |
          python -m pip check
          python -m ruff check .
          python -m mypy src scripts
          python -m pytest -q
          python -m compileall -q src scripts tests
      - name: Rebuild and verify exact-page report without repository drift
        if: runner.os == 'Linux'
        run: |
          python scripts/build_report.py
          python scripts/verify_artifacts.py --built-report output/pdf/Encrypted_Protocol_Topology_Recovery_APA_Report.pdf
          git diff --check
          git diff --exit-code
